    url: 'http://localhost'
paths:
  /api/auth/register:
    post:
      summary: ''
      operationId: postApiAuthRegister
      description: ''
      parameters:
        -
          in: header
          name: Content-Type
          description: ''
          example: application/json
          schema:
            type: string
        -
          in: header
          name: Accept
          description: ''
          example: application/json
          schema:
            type: string
      responses: {  }
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Must not be greater than 50 characters.'
                  example: qnqpumbsvckeyth
                email:
                  type: string
                  description: 'Must be a valid email address. Must not be greater than 255 characters.'
                  example: qcremin@example.org
                username:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: uhylolajzwqufzynhnyng
                language_id:
                  type: number
                  description: 'Must not be greater than 255.'
                  example: 19
                password:
                  type: string
                  description: 'Must match the regex /^(?=.*[A-Za-z])(?=.*\d)(?=.*[@$!%*#?&])[A-Za-z\d@$!%*#?&]+$/. Must be at least 8 characters. Must not be greater than 32 characters.'
                  example: 'QS?|@n6'
                password_confirmation:
                  type: string
                  description: 'Must match the regex /^(?=.*[A-Za-z])(?=.*\d)(?=.*[@$!%*#?&])[A-Za-z\d@$!%*#?&]+$/. Must be at least 8 characters. Must not be greater than 32 characters.'
                  example: wffglskzh
              required:
                - name
                - email
                - username
                - language_id
                - password
                - password_confirmation
      security: []
  /api/auth/login:
