openapi: 3.0.3
info:
  title: ClubBackend_api
  description: ''
  version: 1.0.0
servers:
  -
    url: 'http://localhost'
paths:
  /api/auth/register:
    post:
      summary: ''
      operationId: postApiAuthRegister
      description: ''
      parameters:
        -
          in: header
          name: Content-Type
          description: ''
          example: application/json
          schema:
            type: string
        -
          in: header
          name: Accept
          description: ''
          example: application/json
          schema:
            type: string
      responses: {  }
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Must not be greater than 50 characters.'
                  example: pfeuzp
                email:
                  type: string
                  description: 'Must be a valid email address. Must not be greater than 255 characters.'
                  example: bernadine.jerde@example.org
                username:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: fzuvvxho
                language_id:
                  type: number
                  description: 'Must not be greater than 255.'
                  example: 11
                password:
                  type: string
                  description: 'Must match the regex /^(?=.*[A-Za-z])(?=.*\d)(?=.*[@$!%*#?&])[A-Za-z\d@$!%*#?&]+$/. Must be at least 8 characters. Must not be greater than 32 characters.'
                  example: '~nj1SzbYIb[Kwv%{%'
                password_confirmation:
                  type: string
                  description: 'Must match the regex /^(?=.*[A-Za-z])(?=.*\d)(?=.*[@$!%*#?&])[A-Za-z\d@$!%*#?&]+$/. Must be at least 8 characters. Must not be greater than 32 characters.'
                  example: o
              required:
                - name
                - email
                - username
                - language_id
                - password
                - password_confirmation
      security: []
  /api/auth/login:
    post:
      summary: ''
